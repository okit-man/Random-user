<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- <p>radom user</p> -->
    <div class="block bck-black"></div>
        <div class="block">
            <div class="container">
                <img src="https://randomuser.me/api/portraits/men/75.jpg" alt="random user" class="user-img">
                <p class="user-title">My name is </p>
                <p class="user-description">john deo</p>
                <div class="value-list">
                    <!-- single value -->
                     <button class="icon" data-value="name">
                        <span class="far fa-user"></span>
                     </button>
                     <!-- ended value -->
    
                      <!-- single value -->
                     <button class="icon" data-value="email">
                       <span class="far fa-envelope-open"></span>
                     </button>
                     <!-- ended value -->
    
                      <!-- single value -->
                     <button class="icon" data-value="age">
                        <span class="far fa-calendar-xmark"></span>
                     </button>
                     <!-- ended value -->
    
                      <!-- single value -->
                     <button class="icon" data-value="street">
                        <span class="far fa-map"></span>
                     </button>
                     <!-- ended value -->
    
                      <!-- single value -->
                     <button class="icon" data-value="phone">
                        <span class="fas fa-phone"></span>
                     </button>
                     <!-- ended value -->
    
                      <!-- single value -->
                     <button class="icon" data-value="password">
                        <span class="fas fa-user-lock"></span>
                     </button>
                     <!-- ended value -->
                </div>
                <button class="btn">radom user</button>
            </div>
        </div>


    <script type="module" src="app.js"></script>
</body>
</html>
